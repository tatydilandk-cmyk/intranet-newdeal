name: CI Pipeline - dev

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: 1.0.0
  DOCKER_USER: tatydl

jobs:

  # ===============================
  # JOB 1 - BUILD IMAGE DOCKER
  # ===============================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "tatydl" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t tatydl/intranet-newdeal:1.0.0 .

      - name: Verify image
        run: |
          docker image ls | grep intranet-newdeal

  # ===============================
  # JOB 2 - SCAN SECURITE
  # ===============================
  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image for scan
        run: |
          docker build -t tatydl/intranet-newdeal:1.0.0 .

      - name: Scan vulnerabilites avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tatydl/intranet-newdeal:1.0.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - name: Scan secrets avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '0'

  # ===============================
  # JOB 3 - PUSH IMAGE DOCKER HUB
  # ===============================
  push:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "tatydl" --password-stdin

      - name: Build and Push Docker image
        run: |
          docker build -t tatydl/intranet-newdeal:1.0.0 .
          docker push tatydl/intranet-newdeal:1.0.0

  # ===============================
  # JOB 4 - NOTIFICATION EMAIL
  # ===============================
  notify:
    needs: [build, scan, push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Pipeline - ${{ job.status }} - intranet-newdeal"
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Le pipeline CI sur la branche dev s est termine.
            Statut : ${{ job.status }}
            Repository : ${{ github.repository }}
            Commit : ${{ github.sha }}
